<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#CD0000">
  <!-- Sicherheitsregel: nur eigene Skripte, keine fremden Quellen. Fotos und Ton kommen als blob:/data: aus dem Speicher. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob: data:; connect-src 'self' blob: data:; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>Drehtag-Begleiter</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Hier zeichnet js/app.js die jeweilige Ansicht hinein -->
  <div id="app"></div>
  <!-- Vollbild-Ebenen: Zeichenfläche, Teleprompter, Bildansicht -->
  <div id="overlay" hidden></div>
  <!-- Kurze Rückmeldungen wie „Kopiert“ -->
  <div id="toast" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
